services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: pathway
      POSTGRES_USER: pathway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pathway_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathway -d pathway"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pathway_postgres_data:
