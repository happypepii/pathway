# Standalone test environment: never merge with compose.yaml.
services:
  postgres-test:
    image: postgres:18
    environment:
      POSTGRES_DB: pathway_tests
      POSTGRES_USER: pathway_tests
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pathway_tests -d pathway_tests"]
      interval: 2s
      timeout: 5s
      retries: 30
